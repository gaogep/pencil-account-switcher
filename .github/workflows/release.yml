name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build DMG and zip
        run: chmod +x build.sh Support/make_dmg.sh && ./Support/make_dmg.sh
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Pencil-Account-Switcher-*-arm64.dmg
            build/Pencil-Account-Switcher-*-arm64.zip
          generate_release_notes: true
