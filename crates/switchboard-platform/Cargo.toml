[package]
name = "switchboard-platform"
version = "0.1.0"
edition = "2021"

[dependencies]
switchboard-core = { path = "../switchboard-core" }
tokio = { version = "1", features = ["sync", "time", "process", "fs", "rt", "macros"] }

tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-service-management = "0.3"
objc2-authentication-services = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
serde_json = "1"
winreg = "0.56"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[features]
platform-it = []

[[test]]
name = "platform_integration"
harness = false
required-features = ["platform-it"]
