[package]
name = "switchboard-app"
version = "1.0.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
switchboard-core = { path = "../crates/switchboard-core" }
switchboard-platform = { path = "../crates/switchboard-platform" }
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png", "image-ico"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "=2.1.0"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-single-instance = "2"
winreg = "0.56"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_UI_Shell"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
